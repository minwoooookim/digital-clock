<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Time</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 2vw;
            gap: min(8vh);
            overflow: hidden;
            background-color: #000000;
            color: #ffffff;
        }

        #time-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: min(1vw);
            max-width: 100%;
            flex-shrink: 1;
        }

        #time {
            /* 화면 너비와 높이 중 더 작은 기준에 맞춰 글자 크기를 조절 */
            font-size: min(29vw, 55vh, 65rem);
            line-height: 0.9;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        #right-side {
            display: flex;
            align-items: center;
            flex-direction: column;
            justify-content: center;
            gap: min(10vh);
            margin-left: min(1vw, 1rem);
            flex-shrink: 1;
        }

        .seconds-ampm {
            font-size: min(6vw, 12vh, 12rem);
            line-height: 1.1;
            margin: 0 min(1vw, 1rem);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        #date-day {
            display: flex;
            flex-direction: row;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 100%;
            font-size: min(6.5vw, 10vh, 14rem);
            line-height: 1.1;
            margin: 0;
            gap: min(1vw, 1rem);
            text-align: center;
        }

        #date,
        #day {
            white-space: nowrap;
        }

        #fullscreen-button {
            position: fixed;
            top: 1.5vh;
            right: 1.5vw;
            font-size: clamp(0.75rem, 1.5vw, 1.5rem);
            padding: clamp(6px, 1.2vw, 22px) clamp(8px, 1.5vw, 28px);
            background-color: #0f0f0f;
            color: #777777;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #fullscreen-button:hover {
            color: #ffffff;
        }

        #brightness-controls {
            position: fixed;
            top: calc(20vh);
            right: 1.5vw;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: clamp(6px, 0.8vw, 12px);
            width: clamp(42px, 4vw, 58px);
        }

        #brightness-slider {
            width: clamp(110px, 10vw, 150px);
            height: 20px;
            align-self: center;
            margin: clamp(45px, 5vw, 75px) 0;
            transform: rotate(-90deg);
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            cursor: pointer;
        }

        #brightness-slider::-webkit-slider-runnable-track {
            height: 6px;
            background: #252525;
            border-radius: 999px;
        }

        #brightness-slider::-moz-range-track {
            height: 6px;
            background: #252525;
            border-radius: 999px;
        }

        #brightness-slider::-webkit-slider-thumb {
            width: 16px;
            height: 16px;
            margin-top: -5px;
            -webkit-appearance: none;
            appearance: none;
            background: #111111;
            border: 1px solid #303030;
            border-radius: 50%;
        }

        #brightness-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #111111;
            border: 1px solid #303030;
            border-radius: 50%;
        }

        #brightness-presets {
            display: flex;
            flex-direction: column;
            gap: clamp(4px, 0.5vw, 8px);
        }

        .brightness-button {
            padding: clamp(5px, 0.6vw, 9px) 4px;
            background-color: #080808;
            color: #454545;
            border: none;
            border-radius: 4px;
            font-size: clamp(0.65rem, 1vw, 1rem);
            cursor: pointer;
        }

        .brightness-button:hover,
        .brightness-button[aria-pressed="true"] {
            color: #777777;
            background-color: #111111;
        }
    </style>
</head>
<body>
    <div id="time-container">
        <div id="time"></div>
        <div id="right-side">
            <div id="ampm" class="seconds-ampm"></div>
            <div id="seconds" class="seconds-ampm"></div>
        </div>
    </div>

    <div id="date-day">
        <div id="date"></div>
        <div id="day"></div>
    </div>

    <button id="fullscreen-button" type="button" aria-label="Toggle fullscreen">⛶</button>

    <div id="brightness-controls" aria-label="화면 밝기 조절">
        <input id="brightness-slider" type="range" min="20" max="100" value="100" aria-label="밝기" aria-valuetext="100%">
        <div id="brightness-presets">
            <button class="brightness-button" type="button" data-brightness="100" aria-pressed="true">100%</button>
            <button class="brightness-button" type="button" data-brightness="75" aria-pressed="false">75%</button>
            <button class="brightness-button" type="button" data-brightness="50" aria-pressed="false">50%</button>
            <button class="brightness-button" type="button" data-brightness="35" aria-pressed="false">35%</button>
            <button class="brightness-button" type="button" data-brightness="20" aria-pressed="false">20%</button>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            const ampm = hours >= 12 ? 'PM' : 'AM';
            const formattedHours = String(hours % 12 || 12).padStart(2, '0');

            const date = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = String(now.getFullYear()).slice(-2);
            const formattedDate = `${year}.${month}.${date}`;

            const daysOfWeek = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const day = daysOfWeek[now.getDay()];

            document.getElementById('time').textContent = `${formattedHours}:${minutes}`;
            document.getElementById('ampm').textContent = ampm;
            document.getElementById('seconds').textContent = seconds;
            document.getElementById('date').textContent = formattedDate;
            document.getElementById('day').textContent = day;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                const element = document.documentElement;
                if (element.requestFullscreen) {
                    element.requestFullscreen();
                } else if (element.webkitRequestFullscreen) {
                    element.webkitRequestFullscreen();
                } else if (element.msRequestFullscreen) {
                    element.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        document.getElementById('fullscreen-button').addEventListener('click', toggleFullscreen);

        const brightnessSlider = document.getElementById('brightness-slider');
        const brightnessButtons = document.querySelectorAll('.brightness-button');

        function setBrightness(value) {
            const brightness = Math.min(100, Math.max(20, Number(value)));
            const channel = Math.round(255 * brightness / 100);
            document.body.style.color = `rgb(${channel}, ${channel}, ${channel})`;
            brightnessSlider.value = brightness;
            brightnessSlider.setAttribute('aria-valuetext', `${brightness}%`);
            brightnessButtons.forEach(button => {
                button.setAttribute('aria-pressed', Number(button.dataset.brightness) === brightness ? 'true' : 'false');
            });
            localStorage.setItem('webclock-brightness', String(brightness));
        }

        brightnessSlider.addEventListener('input', event => setBrightness(event.target.value));
        brightnessButtons.forEach(button => {
            button.addEventListener('click', () => setBrightness(button.dataset.brightness));
        });
        setBrightness(localStorage.getItem('webclock-brightness') || 100);

        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
